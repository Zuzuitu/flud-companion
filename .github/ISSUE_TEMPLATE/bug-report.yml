name: Bug report

description: Report a reproducible Flud Companion problem without sharing private pairing data.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Flud Companion.

        **Do not post relay tokens, LAN tokens, pairing QR codes, passwords, keystores or private relay configuration.**

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android Bridge
        - LAN Web Companion
        - Remote Web Companion
        - Cloudflare relay deployment
        - Pairing / QR
        - Accessibility / Auto-start
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Flud Companion version
      placeholder: e.g. 0.24.0 Beta 1
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android device / Android TV
      placeholder: e.g. NVIDIA Shield TV Pro 2019
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version / firmware
      placeholder: e.g. Android TV / Shield Experience version

  - type: dropdown
    id: connection
    attributes:
      label: Connection mode
      options:
        - LAN
        - Remote
        - Both
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Send ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Safe logs / screenshots
      description: Remove tokens, QR codes, URLs containing credentials and other private data before attaching anything.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed tokens, QR codes, passwords and private relay configuration from this report.
          required: true
