name: Cold-start v4 signed test

on:
  push:
    branches: [ main ]
    paths:
      - 'release/COLD-START-V4-SIGNED-TEST.txt'

permissions:
  contents: write

jobs:
  signed-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify permanent signing identity
        env:
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          KEYSTORE="$RUNNER_TEMP/flud-companion-release.jks"
          EXPECTED='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-report.txt" 2>&1
          APK_CERT_LINE="$(grep -i -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner-report.txt" || true)"
          APK_CERT="$(printf '%s\n' "$APK_CERT_LINE" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
          KEYSTORE_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS")"
          KEYSTORE_CERT="$(printf '%s\n' "$KEYSTORE_OUTPUT" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$APK_CERT" = "$EXPECTED"
          test "$KEYSTORE_CERT" = "$EXPECTED"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
          printf 'Expected certificate SHA-256: %s\nAPK certificate SHA-256: %s\n' "$EXPECTED" "$APK_CERT" > "$RUNNER_TEMP/signing-report.txt"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-cold-start-v4-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/apk-sha256.txt
            ${{ runner.temp }}/signing-report.txt
            ${{ runner.temp }}/apksigner-report.txt
          if-no-files-found: error

      - name: Record signed test run id
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > release/COLD-START-V4-SIGNED-TEST-RUN.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/COLD-START-V4-SIGNED-TEST-RUN.txt
          git commit -m 'Record cold-start v4 signed test run'
          git push origin HEAD:main
