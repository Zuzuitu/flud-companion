name: Finalize Beta 2 source

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/finalize-beta2-run.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Bridge version label dynamic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/media/alexlab/fludremote/MainActivity.kt')
          s = p.read_text()
          old = 'text = "Bridge 0.24.0"'
          new = 'text = "Bridge ${BuildConfig.VERSION_NAME}"'
          if old not in s:
              raise SystemExit('Expected hard-coded Bridge version label not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Public source scan
        run: bash scripts/check-public-source.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit final source fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/media/alexlab/fludremote/MainActivity.kt
          git commit -m 'Show actual Bridge build version'
          git push origin HEAD:main
