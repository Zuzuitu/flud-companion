name: Build signed auto-start v7 test

on:
  push:
    branches: [ main ]
    paths:
      - 'release/TEST-AUTOSTART-V7.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v7 patch
        run: python3 scripts/fix-autostart-v7.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify permanent signing identity
        env:
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          EXPECTED='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-report.txt" 2>&1
          cat "$RUNNER_TEMP/apksigner-report.txt"
          APK_CERT_LINE="$(grep -i -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner-report.txt" || true)"
          APK_CERT="$(printf '%s\n' "$APK_CERT_LINE" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$APK_CERT" = "$EXPECTED"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FludCompanion-0.24.4-autostart-v7-signed.apk
          (cd dist && sha256sum FludCompanion-0.24.4-autostart-v7-signed.apk > FludCompanion-0.24.4-autostart-v7-signed.apk.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-0.24.4-autostart-v7-signed
          path: |
            dist/FludCompanion-0.24.4-autostart-v7-signed.apk
            dist/FludCompanion-0.24.4-autostart-v7-signed.apk.sha256
          if-no-files-found: error

      - name: Commit validated v7 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/media/alexlab/fludremote/FludAutoStartService.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Make cold-start recovery wait for Flud to settle'
            git push origin HEAD:main
          fi
          printf 'run=%s\nsource=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > release/AUTOSTART-V7-BUILT.txt
          git add release/AUTOSTART-V7-BUILT.txt
          git commit -m 'Record auto-start v7 signed test build'
          git push origin HEAD:main
