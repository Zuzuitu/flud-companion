name: Prepare 0.24.1 stable

on:
  push:
    branches: [ main ]
    paths:
      - 'release/PREPARE-STABLE-0241.txt'

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stable patch
        run: python3 scripts/prepare-stable-0241.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate self-host relay
        working-directory: selfhost/relay
        run: |
          set -euo pipefail
          node --check src/index.js
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir dist

      - name: Commit validated stable prep
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts selfhost/relay/src/index.js CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No stable prep changes to commit.'
            exit 0
          fi
          git commit -m 'Prepare Flud Companion 0.24.1 stable'
          git push origin HEAD:main
