name: Publish Flud Companion 0.25.3 (one shot)

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/publish-v0.25.3.yml'

permissions:
  contents: write

concurrency:
  group: flud-companion-v0.25.3-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Zuzuitu/flud-companion'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v4

      - name: Fail closed on release metadata or public-source mismatch
        run: |
          set -euo pipefail
          grep -qE '^[[:space:]]*versionCode = 46$' app/build.gradle.kts
          grep -qE '^[[:space:]]*versionName = "0.25.3"$' app/build.gradle.kts
          bash scripts/check-version-consistency.sh
          bash scripts/check-public-source.sh
          node --check selfhost/relay/src/index.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode temporary signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Run unit tests and assemble signed release
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Verify signer and Android version, prepare APK and SHA-256
        env:
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-report.txt"
          actual="$(grep -i -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner-report.txt" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
          expected='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          test "$actual" = "$expected"
          keytool -list -v -keystore "$RUNNER_TEMP/flud-companion-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keystore-report.txt"
          key_actual="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' "$RUNNER_TEMP/keystore-report.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$key_actual" = "$expected"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='46' versionName='0.25.3'"
          cp "$APK" FludCompanion-0.25.3.apk
          sha256sum FludCompanion-0.25.3.apk > FludCompanion-0.25.3.apk.sha256

      - name: Publish new immutable release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.25.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace assets."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.25.3 >/dev/null 2>&1; then
            echo "::error::Tag already exists; refusing to move it."
            exit 1
          fi
          gh release create v0.25.3 \
            FludCompanion-0.25.3.apk \
            FludCompanion-0.25.3.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Flud Companion 0.25.3" \
            --notes-file docs/releases/v0.25.3.md \
            --latest
