name: Commit Beta 2 product patch

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/beta2-product-run.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic patch
        run: python3 scripts/apply-beta2-patch.py

      - name: Public source scan
        run: bash scripts/check-public-source.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Remote relay
        working-directory: selfhost/relay
        run: |
          set -euo pipefail
          node --check src/index.js
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir dist

      - name: Commit product files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/java/media/alexlab/fludremote/BridgeHttpServer.kt \
            app/src/main/java/media/alexlab/fludremote/CloudRelayClient.kt \
            app/src/main/java/media/alexlab/fludremote/FludLauncher.kt \
            app/src/main/java/media/alexlab/fludremote/FludAutoStartService.kt \
            selfhost/relay/src/index.js \
            selfhost/relay/package.json \
            CHANGELOG.md \
            docs/releases/v0.24.1-beta.2.md
          git commit -m 'Fix PWA pairing and cold-start magnet handoff'
          git push origin HEAD:main
