name: Verify release signing

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signing identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          EXPECTED_CERT_SHA256='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-release-signing-verification
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
