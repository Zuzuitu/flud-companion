name: Test Auto-start v11 signed candidate

on:
  push:
    branches:
      - fix/autostart-v11-structural-readiness
    paths:
      - 'app/**'
      - 'config/project-invariants.json'
      - 'docs/PROJECT_STATE.md'
      - '.github/workflows/test-autostart-v11.yml'

permissions:
  contents: read

jobs:
  build-v11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate v11 safety invariants
        run: |
          set -euo pipefail
          grep -F 'semantic-v11+structural-list-stability+preflight-reopen+single-handoff+strict-confirmation' app/src/main/java/media/alexlab/fludremote/FludAutoStartService.kt
          ! grep -F 'performGlobalAction(GLOBAL_ACTION_BACK)' app/src/main/java/media/alexlab/fludremote/FludAutoStartService.kt
          grep -F 'versionName = "0.24.9-rc1"' app/build.gradle.kts
          grep -F 'versionCode = 40' app/build.gradle.kts

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Decode permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed candidate APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify permanent signing identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          EXPECTED='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          REPORT="$RUNNER_TEMP/apksigner.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$REPORT" 2>&1
          cat "$REPORT"
          ACTUAL="$(grep -i -m1 'certificate SHA-256 digest' "$REPORT" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare candidate artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FludCompanion-0.24.9-rc1-autostart-v11-signed.apk"
          sha256sum "$RUNNER_TEMP/FludCompanion-0.24.9-rc1-autostart-v11-signed.apk"

      - name: Upload signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-0.24.9-rc1-autostart-v11-signed
          path: ${{ runner.temp }}/FludCompanion-0.24.9-rc1-autostart-v11-signed.apk
          if-no-files-found: error
