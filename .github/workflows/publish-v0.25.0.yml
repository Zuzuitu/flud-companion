name: Publish Flud Companion 0.25.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v0.25.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.25.0
      VERSION: 0.25.0
      TARGET_SHA: d834aa0e12b20e4941274935d4288a5c01086be7
      EXPECTED_CERT_SHA256: c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998
    steps:
      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi

      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify permanent signing identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          REPORT="$RUNNER_TEMP/apksigner-report.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$REPORT" 2>&1
          CERT_LINE="$(grep -i -m1 'certificate SHA-256 digest' "$REPORT" || true)"
          CERT_SHA256="$(printf '%s\n' "$CERT_LINE" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]' || true)"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          APK_NAME="FludCompanion-$VERSION.apk"
          SHA_NAME="$APK_NAME.sha256"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$APK_NAME" > "$SHA_NAME"
          )
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Flud Companion 0.25.0

          Adds direct `.torrent` file sending alongside magnet links.

          ## What's new

          - Send `.torrent` files directly to Flud from the LAN or Remote PWA.
          - Improved iPhone/iPad Files compatibility when choosing `.torrent` files.
          - Optional Auto-start works with both magnet links and `.torrent` files.
          - Minor file-picker and stability refinements.
          EOF

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_NAME="FludCompanion-$VERSION.apk"
          SHA_NAME="$APK_NAME.sha256"
          gh release create "$TAG" \
            "$RUNNER_TEMP/$APK_NAME" \
            "$RUNNER_TEMP/$SHA_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Flud Companion $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
