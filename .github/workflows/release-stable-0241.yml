name: Publish signed stable 0.24.1

on:
  push:
    branches: [ main ]
    paths:
      - 'release/READY-v0.24.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate stable version
        run: |
          set -euo pipefail
          grep -q 'versionCode = 32' app/build.gradle.kts
          grep -q 'versionName = "0.24.1"' app/build.gradle.kts

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify permanent signing identity
        env:
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          KEYSTORE="$RUNNER_TEMP/flud-companion-release.jks"
          EXPECTED='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          test -s "$KEYSTORE"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-report.txt" 2>&1
          cat "$RUNNER_TEMP/apksigner-report.txt"
          APK_CERT_LINE="$(grep -i -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner-report.txt" || true)"
          APK_CERT="$(printf '%s\n' "$APK_CERT_LINE" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
          KEYSTORE_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS")"
          KEYSTORE_CERT="$(printf '%s\n' "$KEYSTORE_OUTPUT" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$APK_CERT" = "$EXPECTED"
          test "$KEYSTORE_CERT" = "$EXPECTED"

      - name: Prepare stable assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FludCompanion-0.24.1.apk
          (cd dist && sha256sum FludCompanion-0.24.1.apk > FludCompanion-0.24.1.apk.sha256)

      - name: Upload signed stable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-0.24.1-stable-signed
          path: |
            dist/FludCompanion-0.24.1.apk
            dist/FludCompanion-0.24.1.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.24.1
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            dist/FludCompanion-0.24.1.apk \
            dist/FludCompanion-0.24.1.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title 'Flud Companion 0.24.1' \
            --notes-file docs/releases/v0.24.1.md
