name: Build signed auto-start v6 test

on:
  push:
    branches: [ main ]
    paths:
      - 'release/TEST-AUTOSTART-V6.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v6 patch
        run: |
          set -euo pipefail
          python3 scripts/fix-autostart-v6.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('versionCode = 33','versionCode = 34')
          s=s.replace('versionName = "0.24.2"','versionName = "0.24.3"')
          p.write_text(s)
          PY
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'versionName = "0.24.3"' app/build.gradle.kts
          grep -q 'semantic-v6+120s-cold-start+confirmation-latch+screen-gated-gesture' app/src/main/java/media/alexlab/fludremote/FludAutoStartService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify permanent signing identity
        env:
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          KEYSTORE="$RUNNER_TEMP/flud-companion-release.jks"
          EXPECTED='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-report.txt" 2>&1
          APK_CERT_LINE="$(grep -i -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner-report.txt" || true)"
          APK_CERT="$(printf '%s\n' "$APK_CERT_LINE" | tr -d ':' | grep -Eo '[0-9A-Fa-f]{64}' | head -n1 | tr '[:upper:]' '[:lower:]')"
          KEYSTORE_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS")"
          KEYSTORE_CERT="$(printf '%s\n' "$KEYSTORE_OUTPUT" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$APK_CERT" = "$EXPECTED"
          test "$KEYSTORE_CERT" = "$EXPECTED"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FludCompanion-0.24.3-autostart-v6-signed.apk
          sha256sum dist/FludCompanion-0.24.3-autostart-v6-signed.apk > dist/FludCompanion-0.24.3-autostart-v6-signed.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-0.24.3-autostart-v6-signed
          path: |
            dist/FludCompanion-0.24.3-autostart-v6-signed.apk
            dist/FludCompanion-0.24.3-autostart-v6-signed.apk.sha256
          if-no-files-found: error

      - name: Commit validated v6 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/media/alexlab/fludremote/FludAutoStartService.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Lock auto-start navigation after Add torrent detection'
            git push origin HEAD:main
          fi
