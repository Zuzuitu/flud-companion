name: Publish signed beta

on:
  push:
    branches: [ main ]
    paths:
      - 'release/READY-v0.24.0-beta.1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUD_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flud-companion-release.jks"
          chmod 600 "$RUNNER_TEMP/flud-companion-release.jks"

      - name: Build signed release APK
        env:
          FLUD_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/flud-companion-release.jks
          FLUD_SIGNING_STORE_PASSWORD: ${{ secrets.FLUD_SIGNING_STORE_PASSWORD }}
          FLUD_SIGNING_KEY_ALIAS: ${{ secrets.FLUD_SIGNING_KEY_ALIAS }}
          FLUD_SIGNING_KEY_PASSWORD: ${{ secrets.FLUD_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature and signing identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          EXPECTED_CERT_SHA256='c0bbc7472b10c74325039bbf83c9bc2f92e3ff869eaf49599ed67cd546bb5998'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FludCompanion-0.24.0-beta.1.apk
          (cd dist && sha256sum FludCompanion-0.24.0-beta.1.apk > FludCompanion-0.24.0-beta.1.apk.sha256)

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FludCompanion-0.24.0-beta.1-signed
          path: |
            dist/FludCompanion-0.24.0-beta.1.apk
            dist/FludCompanion-0.24.0-beta.1.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.24.0-beta.1
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            dist/FludCompanion-0.24.0-beta.1.apk \
            dist/FludCompanion-0.24.0-beta.1.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title 'Flud Companion 0.24.0 Beta 1' \
            --prerelease \
            --notes-file docs/releases/v0.24.0-beta.1.md
